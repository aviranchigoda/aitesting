version: '3.8'

services:
  secureai-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secureai-bridge
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-in-production}
      - API_KEY_SALT=${API_KEY_SALT:-change-this-in-production}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=https://yourdomain.com,https://api.yourdomain.com
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - secureai-network

  # Optional: Add a reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: secureai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - secureai-bridge
    networks:
      - secureai-network

  # Optional: Add monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: secureai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - secureai-network

networks:
  secureai-network:
    driver: bridge

volumes:
  logs: